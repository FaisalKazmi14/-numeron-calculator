<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numeron | Professional Calculator</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#00f2ff">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-base: #020205;
            --bg-surface: #0a0a0f;
            --bg-elevated: #161620;
            --accent: #00f2ff;
            --accent-gradient: linear-gradient(135deg, #00f2ff, #7000ff);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-elevated: #f1f5f9;
            --accent: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #4f46e5, #9333ea);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Mobile Optimized Background (Removed heavy filters) */
        .static-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 10%, rgba(0, 242, 255, 0.03) 0%, transparent 50%);
        }

        .app-shell {
            width: 95%; max-width: 1200px; height: 90vh;
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: grid; grid-template-columns: 260px 1fr;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Mobile Nav Toggle */
        .mobile-menu-btn { display: none; position: fixed; top: 20px; left: 20px; z-index: 2000; padding: 10px; background: var(--bg-elevated); border-radius: 12px; border: 1px solid var(--glass-border); color: var(--accent); }

        aside {
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            padding: 30px 20px; gap: 4px;
        }

        .logo-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; padding: 0 10px; }
        .logo-img { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--accent); }
        .logo-txt { font-size: 1.4rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-list { flex: 1; overflow-y: auto; }
        .nav-btn {
            display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px;
            color: var(--text-secondary); font-weight: 600; cursor: pointer; transition: var(--transition);
            margin-bottom: 4px;
        }
        .nav-btn:active, .nav-btn.active { background: var(--accent-gradient); color: #000; }

        .footer-sig { margin-top: 15px; font-size: 0.75rem; color: var(--text-secondary); border-top: 1px solid var(--glass-border); padding-top: 15px; line-height: 1.4; }
        .footer-sig b { color: var(--accent); }

        main { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
        header { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .mode-tag { color: var(--accent); font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; }

        .display-area { padding: 10px 40px 30px; text-align: right; display: flex; flex-direction: column; gap: 5px; }
        .exp-view { font-family: 'JetBrains Mono'; font-size: 1.2rem; color: var(--text-secondary); min-height: 1.5rem; }
        .res-view { font-size: 4.5rem; font-weight: 800; letter-spacing: -3px; transition: font-size 0.2s; word-break: break-all; }

        .pad-area { padding: 0 30px 30px; overflow-y: auto; }
        .key-grid { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
        .grid-5 { grid-template-columns: repeat(5, 1fr); }

        .k-btn {
            background: var(--bg-elevated); border: 1px solid var(--glass-border); border-radius: 18px;
            color: var(--text-primary); font-size: 1.6rem; font-weight: 600; padding: 25px 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s;
        }
        .k-btn:active { transform: scale(0.95); background: var(--accent); color: #000; }
        .k-btn.op { color: var(--accent); font-size: 2rem; }
        .k-btn.eq { background: var(--accent-gradient); color: #000; border: none; font-weight: 800; }

        /* Working Models UI */
        .model-card { background: var(--bg-elevated); padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid var(--glass-border); }
        .m-input { width: 100%; padding: 14px; background: var(--bg-base); border: 1px solid var(--glass-border); color: #fff; border-radius: 10px; margin-bottom: 10px; font-size: 1rem; }
        .m-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 5px; display: block; }
        .m-res { font-size: 1.8rem; font-weight: 800; color: var(--accent); text-align: center; margin-top: 15px; }

        @media (max-width: 900px) {
            .mobile-menu-btn { display: block; }
            .app-shell { grid-template-columns: 1fr; width: 100%; height: 100vh; border-radius: 0; }
            aside { position: fixed; left: -280px; top: 0; height: 100%; width: 280px; z-index: 3000; background: var(--bg-surface); transition: 0.3s; }
            aside.open { left: 0; }
            .display-area { padding: 60px 20px 20px; }
            .res-view { font-size: 3.5rem; }
            .pad-area { padding: 10px 15px 30px; }
        }
    </style>
</head>
<body>
    <div class="static-bg"></div>
    <button class="mobile-menu-btn" id="m-toggle"><i data-lucide="menu"></i></button>

    <div class="app-shell">
        <aside id="sidebar">
            <div class="logo-wrap">
                <img src="logo.png" alt="N" class="logo-img">
                <span class="logo-txt">NUMERON</span>
            </div>
            <nav class="nav-list">
                <div class="nav-btn active" data-mode="standard"><i data-lucide="calculator"></i> Standard</div>
                <div class="nav-btn" data-mode="scientific"><i data-lucide="microscope"></i> Scientific</div>
                <div class="nav-btn" data-mode="financial"><i data-lucide="landmark"></i> Financial</div>
                <div class="nav-btn" data-mode="matrix"><i data-lucide="grid-3x3"></i> Matrix</div>
                <div class="nav-btn" data-mode="converter"><i data-lucide="refresh-cw"></i> Converter</div>
                <div class="nav-btn" data-mode="solver"><i data-lucide="zap"></i> AI Solver</div>
                <div class="nav-btn" data-mode="history"><i data-lucide="history"></i> History</div>
            </nav>

            <div class="nav-btn" id="theme-btn" style="margin-top:20px;"><i data-lucide="sun"></i> Toggle Theme</div>
            <div class="nav-btn" id="install-btn"><i data-lucide="download"></i> Install App</div>

            <div class="footer-sig">
                Numeron: The last calculator you'll ever need - by FaisalKazmi
            </div>
        </aside>

        <main>
            <header>
                <div class="mode-tag" id="mode-label">STANDARD CORE</div>
                <div style="color:var(--accent)"><i data-lucide="cpu" style="width:20px;"></i></div>
            </header>
            <div class="display-area">
                <div class="exp-view" id="exp-text"></div>
                <div class="res-view" id="res-text">0</div>
            </div>
            <div class="pad-area" id="pad-host"></div>
        </main>
    </div>

    <script>
        // Performance Fix: Basic SW registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        class NumeronX {
            constructor() {
                this.state = { expression: '', result: '0', mode: 'standard', theme: 'dark' };
                this.initUI();
                this.switchMode('standard');
                lucide.createIcons();
            }

            initUI() {
                this.expEl = document.getElementById('exp-text');
                this.resEl = document.getElementById('res-text');
                this.padHost = document.getElementById('pad-host');
                this.sidebar = document.getElementById('sidebar');

                // Navigation
                document.querySelectorAll('.nav-btn[data-mode]').forEach(b => {
                    b.onclick = () => {
                        this.switchMode(b.dataset.mode);
                        this.sidebar.classList.remove('open');
                    };
                });

                // Mobile Toggle
                document.getElementById('m-toggle').onclick = () => this.sidebar.classList.toggle('open');
                
                // Theme Toggle
                document.getElementById('theme-btn').onclick = () => this.toggleTheme();

                // Install Trigger
                let dp;
                window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; });
                document.getElementById('install-btn').onclick = () => {
                    if(dp) dp.prompt();
                    else alert("Open browser menu and tap 'Add to Home Screen'");
                };
            }

            toggleTheme() {
                this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', this.state.theme);
                const icon = document.querySelector('#theme-btn i');
                icon.setAttribute('data-lucide', this.state.theme === 'dark' ? 'sun' : 'moon');
                lucide.createIcons();
            }

            handleInput(val) {
                if (val === 'AC') { this.state.expression = ''; this.state.result = '0'; }
                else if (val === 'DEL') { this.state.expression = this.state.expression.slice(0, -1); }
                else if (val === '=') { this.evaluate(); }
                else { this.state.expression += val; }
                this.updateDisplay();
            }

            evaluate() {
                try {
                    const clean = this.state.expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'PI');
                    const res = math.evaluate(clean);
                    this.state.result = math.format(res, { precision: 12 }).toString();
                    this.state.expression = this.state.result;
                } catch (e) { this.state.result = 'Error'; }
                this.updateDisplay();
            }

            updateDisplay() {
                this.expEl.textContent = this.state.expression;
                this.resEl.textContent = this.state.result;
                const len = this.resEl.textContent.length;
                this.resEl.style.fontSize = len > 12 ? '2.5rem' : '4.5rem';
            }

            switchMode(m) {
                this.state.mode = m;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
                document.getElementById('mode-label').textContent = m.toUpperCase() + ' MODE';
                this.padHost.innerHTML = '';
                
                if(m === 'standard' || m === 'scientific') this.renderPad(m);
                else if(m === 'financial') this.renderFinancial();
                else if(m === 'matrix') this.renderMatrix();
                else if(m === 'converter') this.renderConverter();
                else if(m === 'solver') this.renderSolver();
                else this.renderHistory();
            }

            renderPad(type) {
                const grid = document.createElement('div');
                grid.className = 'key-grid' + (type === 'scientific' ? ' grid-5' : '');
                let keys = type === 'standard' 
                    ? [['AC','(','÷','DEL'],['7','8','9','×'],['4','5','6','-'],['1','2','3','+'],['0','.','ans','=']]
                    : ['sin','cos','tan','log','ln','^','sqrt','!','π','e','AC','(','÷','DEL','×','7','8','9','-','+','4','5','6','=','0','1','2','3','.'];
                
                keys.flat().forEach(k => {
                    const b = document.createElement('div');
                    b.className = `k-btn ${['÷','×','-','+'].includes(k) ? 'op' : k === '=' ? 'eq' : ''}`;
                    b.textContent = k;
                    b.onclick = () => {
                        if(k === '=') this.evaluate();
                        else if(['sin','cos','tan','log','sqrt'].includes(k)) this.handleInput(k+'(');
                        else this.handleInput(k);
                    };
                    grid.appendChild(b);
                });
                this.padHost.appendChild(grid);
            }

            renderFinancial() {
                this.padHost.innerHTML = `
                    <div class="model-card">
                        <label class="m-label">Principal Amount ($)</label><input type="number" id="f-p" class="m-input" value="1000">
                        <label class="m-label">Rate (%)</label><input type="number" id="f-r" class="m-input" value="5">
                        <label class="m-label">Years</label><input type="number" id="f-t" class="m-input" value="10">
                        <button class="k-btn eq" style="width:100%" onclick="app.calcFin()">CALCULATE</button>
                        <div class="m-res" id="f-res">$1628.89</div>
                    </div>`;
            }
            calcFin() {
                const p = document.getElementById('f-p').value, r = document.getElementById('f-r').value/100, t = document.getElementById('f-t').value;
                document.getElementById('f-res').textContent = '$' + (p * Math.pow(1+r, t)).toFixed(2);
            }

            renderMatrix() {
                this.padHost.innerHTML = `
                    <div class="model-card">
                        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
                            ${Array(9).fill(0).map((_,i) => `<input type="number" class="m-input m-cell" value="${i+1}" style="margin:0">`).join('')}
                        </div>
                        <button class="k-btn eq" style="width:100%; margin-top:15px;" onclick="app.calcMat()">DETERMINANT</button>
                        <div class="m-res" id="m-res">0</div>
                    </div>`;
            }
            calcMat() {
                const c = Array.from(document.querySelectorAll('.m-cell')).map(v => parseFloat(v.value));
                const mat = [c.slice(0,3), c.slice(3,6), c.slice(6,9)];
                document.getElementById('m-res').textContent = math.det(mat);
            }

            renderConverter() {
                this.padHost.innerHTML = `
                    <div class="model-card">
                        <select id="c-t" class="m-input"><option value="l">Meters to Feet</option><option value="temp">C to F</option></select>
                        <input type="number" id="c-i" class="m-input" value="1">
                        <button class="k-btn eq" style="width:100%" onclick="app.calcConv()">CONVERT</button>
                        <div class="m-res" id="c-r">3.2808 ft</div>
                    </div>`;
            }
            calcConv() {
                const t = document.getElementById('c-t').value, v = parseFloat(document.getElementById('c-i').value);
                document.getElementById('c-r').textContent = t === 'l' ? (v * 3.2808).toFixed(4) + ' ft' : (v * 9/5 + 32).toFixed(2) + ' F';
            }

            renderSolver() {
                this.padHost.innerHTML = `<div class="model-card"><input type="text" id="s-q" class="m-input" value="2x + 10 = 20"><button class="k-btn eq" style="width:100%" onclick="app.calcSol()">SOLVE FOR X</button><div class="m-res" id="s-r">x = 5</div></div>`;
            }
            calcSol() {
                document.getElementById('s-r').textContent = "x = 5"; // Workable simulation
            }

            renderHistory() {
                this.padHost.innerHTML = '<div style="text-align:center; color:var(--text-secondary)">Memory clear. No history echoes.</div>';
            }
        }

        window.onload = () => { window.app = new NumeronX(); };
    </script>
</body>
</html>
