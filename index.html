<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numeron | Professional Calculator</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#00f2ff">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #050505;
            --surf: #0f0f15;
            --btn: #161620;
            --accent: #00f2ff;
            --grad: linear-gradient(135deg, #00f2ff, #7000ff);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surf: #ffffff;
            --btn: #f1f5f9;
            --accent: #4f46e5;
            --grad: linear-gradient(135deg, #4f46e5, #9333ea);
            --text: #0f172a;
            --text-dim: #64748b;
            --border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; transition: 0.3s; }

        /* Navigation Sidebar */
        aside {
            width: 260px; background: rgba(0,0,0,0.2); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 30px 15px; gap: 5px; z-index: 1000;
        }

        .logo-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; padding: 0 10px; }
        .logo-img { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--accent); }
        .logo-txt { font-weight: 800; font-size: 1.3rem; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-btn {
            display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px;
            color: var(--text-dim); font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .nav-btn:active, .nav-btn.active { background: var(--grad); color: #000; }
        .nav-btn i { width: 18px; }

        .footer-sig { margin-top: auto; font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); padding-top: 15px; }

        /* Main Workspace */
        main { flex: 1; display: grid; grid-template-rows: auto 1fr; overflow: hidden; position: relative; }
        
        .display-unit { padding: 30px 40px; text-align: right; border-bottom: 1px solid var(--border); }
        .exp-line { font-size: 1.1rem; color: var(--text-dim); min-height: 1.5rem; letter-spacing: 1px; }
        .res-line { font-size: 4.5rem; font-weight: 800; letter-spacing: -2px; overflow: hidden; text-overflow: ellipsis; }

        .pad-unit { padding: 25px; overflow-y: auto; }
        .key-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
        .grid-5 { grid-template-columns: repeat(5, 1fr); }

        .k-btn {
            background: var(--btn); border: 1px solid var(--border); border-radius: 15px;
            color: var(--text); font-size: 1.5rem; font-weight: 600; padding: 25px 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .k-btn:active { transform: scale(0.95); background: var(--accent); color: #000; }
        .k-btn.op { color: var(--accent); font-size: 1.8rem; }
        .k-btn.eq { background: var(--grad); color: #000; border: none; font-weight: 800; }

        /* Special Models */
        .m-card { background: var(--btn); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        .m-input { width: 100%; padding: 15px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 12px; margin-bottom: 10px; font-size: 1rem; }
        .m-btn { background: var(--grad); color: #000; width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }

        /* Mobile Adjustments */
        .menu-trig { display: none; position: fixed; top: 15px; left: 15px; z-index: 2000; background: var(--btn); padding: 10px; border-radius: 10px; border: 1px solid var(--border); color: var(--accent); }

        @media (max-width: 850px) {
            aside { position: fixed; left: -260px; height: 100%; transition: 0.3s; background: var(--surf); }
            aside.open { left: 0; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
            .menu-trig { display: block; }
            .res-line { font-size: 3.5rem; padding-top: 30px; }
            .pad-unit { padding: 15px; }
            .k-btn { padding: 20px 0; }
        }
    </style>
</head>
<body>
    <button class="menu-trig" id="m-open"><i data-lucide="menu"></i></button>

    <aside id="sidebar">
        <div class="logo-wrap">
            <img src="logo.png" alt="N" class="logo-img">
            <span class="logo-txt">NUMERON</span>
        </div>
        <nav>
            <div class="nav-btn active" onclick="app.setMode('standard')"><i data-lucide="calculator"></i> Standard</div>
            <div class="nav-btn" onclick="app.setMode('scientific')"><i data-lucide="microscope"></i> Scientific</div>
            <div class="nav-btn" onclick="app.setMode('financial')"><i data-lucide="landmark"></i> Financial</div>
            <div class="nav-btn" onclick="app.setMode('matrix')"><i data-lucide="grid-3x3"></i> Matrix</div>
            <div class="nav-btn" onclick="app.setMode('converter')"><i data-lucide="refresh-cw"></i> Converter</div>
            <div class="nav-btn" onclick="app.setMode('history')"><i data-lucide="history"></i> History</div>
            <div class="nav-btn" onclick="app.toggleTheme()" style="margin-top:20px;"><i data-lucide="sun" id="t-icon"></i> Toggle Vision</div>
            <div class="nav-btn" id="pwa-btn"><i data-lucide="download"></i> Install App</div>
        </nav>
        <div class="footer-sig">
            Numeron: The last calculator you'll ever need - by FaisalKazmi
        </div>
    </aside>

    <main>
        <div class="display-unit">
            <div class="exp-line" id="exp"></div>
            <div class="res-line" id="res">0</div>
        </div>
        <div class="pad-unit" id="pad"></div>
    </main>

    <script>
        // CRITICAL PWA SETUP
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(()=>{});
        }

        class NumeronFinal {
            constructor() {
                this.state = { exp: '', res: '0', mode: 'standard', theme: 'dark' };
                this.init();
            }

            init() {
                document.getElementById('m-open').onclick = () => document.getElementById('sidebar').classList.toggle('open');
                
                let dp;
                window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; });
                document.getElementById('pwa-btn').onclick = () => {
                    if(dp) dp.prompt();
                    else alert("Install via your browser's menu (⋮) -> 'Install App' or 'Add to Home Screen'.");
                };

                this.setMode('standard');
                lucide.createIcons();
            }

            toggleTheme() {
                this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', this.state.theme);
                document.getElementById('t-icon').setAttribute('data-lucide', this.state.theme === 'dark' ? 'sun' : 'moon');
                lucide.createIcons();
            }

            setMode(m) {
                this.state.mode = m;
                document.getElementById('sidebar').classList.remove('open');
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.toggle('active', b.innerText.toLowerCase().includes(m));
                });
                
                const host = document.getElementById('pad');
                host.innerHTML = '';
                
                if(m === 'standard' || m === 'scientific') this.renderGrid(m, host);
                else if(m === 'financial') this.renderFinancial(host);
                else if(m === 'matrix') this.renderMatrix(host);
                else if(m === 'converter') this.renderConverter(host);
                else host.innerHTML = '<div style="text-align:center;color:var(--text-dim)">No history found.</div>';
            }

            renderGrid(type, host) {
                const grid = document.createElement('div');
                grid.className = 'key-grid' + (type === 'scientific' ? ' grid-5' : '');
                const keys = type === 'standard' 
                    ? [['AC','(','÷','DEL'],['7','8','9','×'],['4','5','6','-'],['1','2','3','+'],['0','.','ans','=']]
                    : ['sin','cos','tan','log','ln','^','sqrt','!','π','e','AC','(','÷','DEL','×','7','8','9','-','+','4','5','6','=','0','1','2','3','.'];
                
                keys.flat().forEach(k => {
                    const b = document.createElement('div');
                    b.className = `k-btn ${['÷','×','-','+'].includes(k) ? 'op' : k === '=' ? 'eq' : ''}`;
                    b.innerText = k;
                    b.onclick = () => this.handleKey(k);
                    grid.appendChild(b);
                });
                host.appendChild(grid);
            }

            handleKey(k) {
                if(k === 'AC') { this.state.exp = ''; this.state.res = '0'; }
                else if(k === 'DEL') { this.state.exp = this.state.exp.slice(0,-1); }
                else if(k === '=') { this.calc(); }
                else if(['sin','cos','tan','log','sqrt'].includes(k)) { this.state.exp += k + '('; }
                else if(k === 'ans') { this.state.exp += this.state.res; }
                else { this.state.exp += k; }
                this.upd();
            }

            calc() {
                try {
                    const c = this.state.exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'PI');
                    const r = math.evaluate(c);
                    this.state.res = math.format(r, { precision: 12 }).toString();
                    this.state.exp = this.state.res;
                } catch { this.state.res = 'Error'; }
                this.upd();
            }

            upd() {
                document.getElementById('exp').innerText = this.state.exp;
                document.getElementById('res').innerText = this.state.res;
                const r = document.getElementById('res');
                r.style.fontSize = this.state.res.length > 12 ? '2.5rem' : '4.5rem';
            }

            renderFinancial(h) {
                h.innerHTML = `<div class="m-card"><input type="number" id="fp" class="m-input" placeholder="Amount ($)"><input type="number" id="fr" class="m-input" placeholder="Rate (%)"><input type="number" id="ft" class="m-input" placeholder="Years"><button class="m-btn" onclick="app.doFin()">CALCULATE</button><div id="fout" style="margin-top:20px; font-size:2rem; font-weight:800; color:var(--accent); text-align:center"></div></div>`;
            }
            doFin() {
                const p = document.getElementById('fp').value, r = document.getElementById('fr').value/100, t = document.getElementById('ft').value;
                document.getElementById('fout').innerText = '$' + (p * Math.pow(1+r, t)).toFixed(2);
            }

            renderMatrix(h) {
                h.innerHTML = `<div class="m-card"><div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">${Array(9).fill(0).map((_,i)=>`<input type="number" class="m-input mc" value="${i+1}" style="margin:0">`).join('')}</div><button class="m-btn" onclick="app.doMat()">FIND DETERMINANT</button><div id="mout" style="margin-top:20px; font-size:2rem; text-align:center; color:var(--accent)"></div></div>`;
            }
            doMat() {
                const c = Array.from(document.querySelectorAll('.mc')).map(i=>parseFloat(i.value));
                document.getElementById('mout').innerText = math.det([c.slice(0,3),c.slice(3,6),c.slice(6,9)]);
            }

            renderConverter(h) {
                h.innerHTML = `<div class="m-card"><select id="ct" class="m-input"><option value="l">Meters to Feet</option></select><input type="number" id="ci" class="m-input" value="1"><button class="m-btn" onclick="app.doConv()">CONVERT</button><div id="cout" style="margin-top:20px; font-size:2rem; text-align:center; color:var(--accent)"></div></div>`;
            }
            doConv() {
                document.getElementById('cout').innerText = (document.getElementById('ci').value * 3.2808).toFixed(4) + ' ft';
            }
        }

        window.onload = () => { window.app = new NumeronFinal(); };
    </script>
</body>
</html>
