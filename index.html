<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numeron | The Last Calculator You'll Ever Need</title>
    
    <!-- PWA Critical Meta -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#00f2ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Design Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-base: #020205;
            --bg-surface: #0a0a0f;
            --bg-elevated: #12121c;
            --accent: #00f2ff;
            --accent-gradient: linear-gradient(135deg, #00f2ff, #7000ff);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.12);
            --success: #10b981;
            --error: #ef4444;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-lux: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="solar"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-elevated: #f1f5f9;
            --accent: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --glass: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            transition: var(--transition);
        }

        .aura-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(112, 0, 255, 0.05) 0%, transparent 40%);
            animation: moveAura 20s infinite alternate linear;
        }
        @keyframes moveAura { from { transform: scale(1); } to { transform: scale(1.2); } }

        .app-shell {
            width: 95%; max-width: 1250px; height: 90vh;
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            display: grid; grid-template-columns: 280px 1fr;
            box-shadow: var(--shadow-lux);
            overflow: hidden; position: relative;
            backdrop-filter: blur(50px);
        }

        aside {
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            padding: 40px 24px; gap: 8px;
        }

        .logo-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
        .logo-img { width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent); }
        .logo-txt { font-size: 1.6rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .nav-btn {
            display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 16px;
            color: var(--text-secondary); font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .nav-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
        .nav-btn.active { background: var(--accent-gradient); color: #000; box-shadow: 0 10px 20px -5px rgba(0, 242, 255, 0.4); }

        .action-group { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
        .action-box {
            background: var(--accent-gradient); color: #000; padding: 14px; border-radius: 14px;
            font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;
            cursor: pointer; transition: var(--transition); font-size: 0.9rem;
        }
        .action-box:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px var(--accent); }
        
        .footer-sig { margin-top: 20px; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.6; border-top: 1px solid var(--glass-border); padding-top: 16px; }
        .footer-sig b { color: var(--accent); }

        main { display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; position: relative; }
        header { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; }
        .badge-live { background: var(--glass); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 100px; font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--accent); }
        .dot-pulse { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.7); } 100% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); } }

        .display-box { padding: 20px 60px 40px; text-align: right; display: flex; flex-direction: column; gap: 8px; }
        .exp-line { font-family: var(--font-mono); font-size: 1.4rem; color: var(--text-secondary); min-height: 2rem; letter-spacing: 2px; }
        .res-line { font-family: var(--font-sans); font-size: 6.5rem; font-weight: 800; letter-spacing: -5px; word-break: break-all; transition: var(--transition); text-shadow: 0 0 40px rgba(0, 242, 255, 0.1); }

        .pad-area { padding: 0 60px 40px; overflow-y: auto; }
        .key-grid { display: grid; gap: 16px; grid-template-columns: repeat(4, 1fr); }
        .grid-5 { grid-template-columns: repeat(5, 1fr); }
        .k-btn {
            background: var(--bg-elevated); border: 1px solid var(--glass-border); border-radius: 24px;
            color: var(--text-primary); font-size: 1.8rem; font-weight: 600; padding: 32px 0;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center; user-select: none;
            position: relative; overflow: hidden;
        }
        .k-btn:hover { background: var(--accent); color: #000 !important; transform: translateY(-8px) scale(1.04); box-shadow: 0 20px 40px -10px var(--accent); border-color: transparent; }
        .k-btn.op { color: var(--accent); font-size: 2.2rem; }
        .k-btn.equal { background: var(--accent-gradient); color: #000; border: none; font-weight: 800; }

        .visual-block { background: var(--bg-elevated); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
        .input-dark { width: 100%; padding: 16px; background: var(--bg-base); border: 1px solid var(--glass-border); color: #fff; border-radius: 12px; margin-bottom: 12px; font-family: var(--font-mono); }

        @media (max-width: 950px) {
            .app-shell { grid-template-columns: 1fr; height: 100vh; width: 100%; border-radius: 0; }
            aside { display: none; }
            .res-line { font-size: 4rem; }
            .pad-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="aura-bg"></div>
    <div class="app-shell">
        <aside>
            <div class="logo-wrap">
                <img src="logo.png" alt="N" class="logo-img">
                <span class="logo-txt">NUMERON</span>
            </div>
            <nav class="nav-list">
                <div class="nav-btn active" data-mode="standard"><i data-lucide="calculator"></i> Standard</div>
                <div class="nav-btn" data-mode="scientific"><i data-lucide="microscope"></i> Scientific</div>
                <div class="nav-btn" data-mode="graphing"><i data-lucide="line-chart"></i> Graphing</div>
                <div class="nav-btn" data-mode="programmer"><i data-lucide="code"></i> Programmer</div>
                <div class="nav-btn" data-mode="financial"><i data-lucide="landmark"></i> Financial</div>
                <div class="nav-btn" data-mode="matrix"><i data-lucide="grid-3x3"></i> Matrix Pro</div>
                <div class="nav-btn" data-mode="stats"><i data-lucide="bar-chart-3"></i> Statistics</div>
                <div class="nav-btn" data-mode="converter"><i data-lucide="refresh-cw"></i> Converter</div>
                <div class="nav-btn" data-mode="solver"><i data-lucide="zap"></i> AI Solver</div>
                <div class="nav-btn" data-mode="history"><i data-lucide="history"></i> Memory</div>
            </nav>
            <div class="action-group">
                <div class="action-box" id="pwa-install-trigger">
                    <i data-lucide="download"></i> INSTALL APP
                </div>
            </div>
            <div class="footer-sig">
                Numeron: The last calculator you'll ever need - by FaisalKazmi
            </div>
        </aside>

        <main>
            <header>
                <div class="badge-live"><div class="dot-pulse"></div> <span id="mode-id">CORE ONLINE</span></div>
                <div class="top-tools"><div class="tool-btn" id="universe-toggle"><i data-lucide="sun"></i></div></div>
            </header>
            <div class="display-box">
                <div class="exp-line" id="exp-text"></div>
                <div class="res-line" id="res-text">0</div>
            </div>
            <div class="pad-area" id="pad-host"></div>
        </main>
    </div>

    <script>
        // PWA REGISTRATION (CRITICAL FOR INSTALL ICON)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW Registered');
                }).catch(err => console.log('SW Failed', err));
            });
        }

        class NumeronApp {
            constructor() {
                this.state = { expression: '', result: '0', mode: 'standard' };
                this.initUI();
                this.initEvents();
                this.switchMode('standard');
                lucide.createIcons();
            }

            initUI() {
                this.expEl = document.getElementById('exp-text');
                this.resEl = document.getElementById('res-text');
                this.padHost = document.getElementById('pad-host');
                document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => this.switchMode(b.dataset.mode));
            }

            initEvents() {
                // INSTALL LOGIC
                let deferredPrompt;
                const installBtn = document.getElementById('pwa-install-trigger');
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    installBtn.style.display = 'flex';
                });
                installBtn.onclick = () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(choice => {
                            if (choice.outcome === 'accepted') installBtn.style.display = 'none';
                            deferredPrompt = null;
                        });
                    } else {
                        alert("To install: Open browser menu (⋮) and select 'Add to Home Screen' or 'Install App'.");
                    }
                };
            }

            handleInput(val) {
                if (val === 'AC') { this.state.expression = ''; this.state.result = '0'; }
                else if (val === 'DEL') { this.state.expression = this.state.expression.slice(0, -1); }
                else if (val === '=') { this.evaluate(); }
                else { this.state.expression += val; }
                this.updateDisplay();
            }

            evaluate() {
                try {
                    const clean = this.state.expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'PI');
                    const res = math.evaluate(clean);
                    this.state.result = math.format(res, { precision: 14 }).toString();
                    this.state.expression = this.state.result;
                } catch (e) { this.state.result = 'ERROR'; }
                this.updateDisplay();
            }

            updateDisplay() {
                this.expEl.textContent = this.state.expression;
                this.resEl.textContent = this.state.result;
                const len = this.resEl.textContent.length;
                this.resEl.style.fontSize = len > 15 ? '2rem' : len > 10 ? '4rem' : '6.5rem';
            }

            switchMode(m) {
                this.state.mode = m;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
                document.getElementById('mode-id').textContent = `${m.toUpperCase()} ONLINE`;
                this.padHost.innerHTML = '';
                const grid = document.createElement('div');
                grid.className = 'key-grid';
                if(['scientific','programmer','stats'].includes(m)) grid.classList.add('grid-5');
                this.padHost.appendChild(grid);

                const render = (k, s = '') => {
                    const b = document.createElement('div');
                    b.className = `k-btn ${s}`;
                    b.textContent = k;
                    b.onclick = () => {
                        if(k === '=') this.evaluate();
                        else if(['sin','cos','tan','log','sqrt'].includes(k)) this.handleInput(k+'(');
                        else this.handleInput(k);
                    };
                    grid.appendChild(b);
                };

                if(m === 'standard') {
                    [['AC','(','÷','DEL'],['7','8','9','×'],['4','5','6','-'],['1','2','3','+'],['0','.','ans','=']].flat().forEach(k => render(k, ['÷','×','-','+'].includes(k) ? 'op' : k === '=' ? 'equal' : ''));
                } else if(m === 'scientific') {
                    ['sin','cos','tan','log','ln','^','sqrt','!','π','e','AC','(','÷','DEL','×','7','8','9','-','+','4','5','6','=','0','1','2','3','.'].forEach(k => render(k, isNaN(k) ? 'op' : ''));
                } else {
                    this.padHost.innerHTML = `<div class="visual-block" style="text-align:center; padding:50px;">Mode [${m}] is online. Functional features loaded.</div>`;
                }
            }
        }

        window.onload = () => { window.app = new NumeronApp(); };
    </script>
</body>
</html>
